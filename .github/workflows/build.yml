name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      # ── Decode keystore dari GitHub Secret ─────────────────────────────────
      # Jika KEYSTORE_BASE64 secret tidak ada, gunakan debug keystore biasa
      - name: Setup signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using release keystore from secret"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
            echo "KEYSTORE_READY=true" >> $GITHUB_ENV
          else
            echo "No keystore secret found, using debug keystore"
            echo "KEYSTORE_READY=false" >> $GITHUB_ENV
          fi

      - name: Print SHA-1 fingerprint (for Google Console)
        run: |
          echo "========================================"
          echo "📋 SHA-1 Fingerprint untuk Google Cloud Console:"
          echo "========================================"
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android 2>/dev/null | grep "SHA1:" || echo "Debug keystore not found"
          echo "========================================"

      - name: Build release APK
        run: flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation

      - name: Print SHA-1 fingerprint (untuk Google Cloud Console)
        run: |
          echo "========================================"
          echo "SHA-1 dari debug keystore (daftarkan di Google Console):"
          echo "========================================"
          # Debug keystore dibuat Flutter saat pertama build
          KEYSTORE="$HOME/.android/debug.keystore"
          if [ -f "$KEYSTORE" ]; then
            keytool -list -v \
              -keystore "$KEYSTORE" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android 2>/dev/null \
              | grep -E "SHA1:|SHA256:"
          else
            echo "Keystore tidak ditemukan di $KEYSTORE"
            find $HOME -name "*.keystore" 2>/dev/null | head -5
          fi
          echo "========================================"
          echo ""
          echo "SHA-1 dari APK yang dihasilkan:"
          echo "========================================"
          keytool -printcert \
            -jarfile build/app/outputs/flutter-apk/app-release.apk \
            2>/dev/null | grep -E "SHA1:|SHA256:" \
            || echo "Tidak bisa baca cert dari APK"
          echo "========================================"

      - name: Get version tag
        id: version
        run: echo "VERSION=v$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "MengFin ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 📱 MengFin Android APK
            
            ### ✅ Fitur
            - Dashboard keuangan real-time
            - Input transaksi (online & offline)
            - Anggaran bulanan & Goals / tabungan
            - AI Financial Advisor (Gemini)
            - Sync otomatis saat online
            
            ### 📥 Cara Install
            1. Download **app-release.apk** di bawah
            2. Buka di HP → izinkan "Install dari sumber tidak dikenal"
            3. Install dan buka app
            
            > 🌐 Server: Railway Cloud 24/7 + MongoDB Atlas
          files: build/app/outputs/flutter-apk/app-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
