name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # Decode release keystore dari GitHub Secret (jika ada)
      - name: Setup signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using release keystore from secret"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/keystore.jks
            printf 'storePassword=${{ secrets.KEYSTORE_PASSWORD }}\nkeyPassword=${{ secrets.KEY_PASSWORD }}\nkeyAlias=${{ secrets.KEY_ALIAS }}\nstoreFile=keystore.jks\n' > android/key.properties
            echo "KEYSTORE_READY=true" >> $GITHUB_ENV
          else
            echo "KEYSTORE_READY=false" >> $GITHUB_ENV
          fi

      - name: Get version tag
        id: version
        run: echo "VERSION=v$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Build release APK (Split ABI & Obfuscate)
        run: flutter build apk --split-per-abi --obfuscate --split-debug-info=build/debug-info --release --android-skip-build-dependency-validation --dart-define=APP_BUILD_TAG=${{ steps.version.outputs.VERSION }}

      - name: Print SHA-1 dari APK (untuk verifikasi)
        run: |
          echo "========================================"
          echo "Build tag tertanam: ${{ steps.version.outputs.VERSION }}"
          if [ "$KEYSTORE_READY" = "true" ]; then
            echo "Signed dengan: RELEASE keystore"
          else
            echo "Signed dengan: DEBUG keystore"
          fi
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "Cert for $apk:"
            keytool -printcert -jarfile "$apk" 2>/dev/null | grep -E "SHA1:|SHA256:" || echo "Tidak bisa baca cert"
          done
          echo "========================================"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "MengFin ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 📱 MengFin Android APK (${{ steps.version.outputs.VERSION }}) - Mode Lokal (Offline-First)
            
            ### ✨ Pembaruan Mode Lokal & Cadangan Database:
            - **100% Mode Lokal**: Berjalan mandiri tanpa dependensi server backend Railway
            - **Backup & Restore JSON**: Ekspor dan pulihkan seluruh data (6 tabel database lokal) dengan format terstruktur berversi
            - **Bypass Login**: Langsung masuk beranda tanpa layar login Google
            - **Keamanan Biometrik**: Proteksi sidik jari/wajah tetap aktif mengamankan sesi lokal
            - **Degradasi Anggun**: Cek pembaruan langsung via GitHub Releases, OCR struk lokal ML Kit
            - **Performa Ringan**: APK split per-ABI (<25 MB) dengan proteksi Dart code obfuscation
            
            ### 📥 Panduan Instalasi:
            1. Unduh APK sesuai arsitektur HP kamu (umumnya **app-arm64-v8a-release.apk**).
            2. Instal menimpa versi sebelumnya (keystore signing tetap sama).
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
