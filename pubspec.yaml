name: mengfin
description: MengFin - Personal Finance Tracker
publish_to: 'none'
version: 3.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP
  http: ^1.2.0

  # State management
  provider: ^6.1.2

  # Charts
  fl_chart: ^0.70.0

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2

  # Offline support
  sqflite: ^2.3.3
  connectivity_plus: ^6.0.3
  path: ^1.9.0

  # Auth
  google_sign_in: ^6.2.1
  google_sign_in_web: ^0.12.4

  # Update checker
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  speech_to_text: ^7.5.0
  permission_handler: ^13.0.2
  csv: ^8.0.0
  pdf: ^3.13.1
  share_plus: ^12.0.2
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
