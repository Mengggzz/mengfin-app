<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MengFin - Kelola keuangan pribadi dengan cerdas">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MengFin">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>MengFin</title>
  <link rel="manifest" href="manifest.json">

  <script>
    /**
     * ─── LANGKAH 1: Deteksi callback dari Google (jalankan SEBELUM Flutter load) ───
     * Google redirect kembali ke app dengan URL: /#access_token=TOKEN&...
     * Kita simpan token ke sessionStorage, lalu bersihkan URL.
     */
    (function detectOAuthReturn() {
      var hash = window.location.hash;
      // Format Google callback: #access_token=... (bukan Flutter route #/...)
      if (hash && hash.indexOf('access_token=') >= 0 && hash.charAt(1) !== '/') {
        var params = new URLSearchParams(hash.substring(1));
        var token = params.get('access_token');
        if (token) {
          try { sessionStorage.setItem('_gat', token); } catch (e) {}
          // Bersihkan URL → Flutter router tidak bingung
          window.history.replaceState(null, '', '/#/login');
        }
      }
    })();

    var GOOGLE_CLIENT_ID = '266649571000-80vs1ngb0cnn2vo06aoei8katfmu4lhg.apps.googleusercontent.com';

    /**
     * ─── LANGKAH 2: Trigger login ─────────────────────────────────────────────────
     * Pakai window.location.href = Google OAuth URL
     * → Full page redirect, TIDAK bisa diblock browser (bukan popup!)
     * → Tidak butuh GIS library, tidak ada masalah trusted gesture
     */
    window.triggerGoogleSignIn = function () {
      var params = new URLSearchParams({
        client_id: GOOGLE_CLIENT_ID,
        redirect_uri: window.location.origin + '/',
        response_type: 'token',
        scope: 'openid email profile',
        prompt: 'select_account',
        include_granted_scopes: 'true'
      });
      // Redirect ke halaman login Google — tidak ada popup, tidak bisa diblock!
      window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
    };

    // Helper untuk Flutter baca/hapus token dari sessionStorage
    window.getPendingToken = function () {
      try { return sessionStorage.getItem('_gat'); } catch (e) { return null; }
    };
    window.clearPendingToken = function () {
      try { sessionStorage.removeItem('_gat'); } catch (e) {}
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
